name: Phase 1 CI

on:
  pull_request:
  push:
    branches:
      - "phase/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint, native, and APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAMEX_GIT_SHA: ${{ github.sha }}
      CI: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Verify patch whitespace
        run: git diff --check origin/main...HEAD

      - name: Verify camera architecture
        run: ./scripts/verify-camera-architecture.sh

      - name: Verify simple OTA architecture
        run: bash scripts/verify-development-ota.sh

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          dependency-graph: disabled

      - name: Install pinned Android SDK, NDK, and CMake
        run: ./scripts/install-android-sdk.sh

      - name: Set reproducible build metadata
        run: |
          commit_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          commit_timestamp="$(date --utc --date="@${commit_epoch}" +%Y-%m-%dT%H:%M:%SZ)"
          short_sha="${GITHUB_SHA:0:12}"
          echo "CAMEX_BUILD_TIMESTAMP_UTC=${commit_timestamp}" >> "$GITHUB_ENV"
          echo "DEV_OTA_VERSION_CODE=${commit_epoch}" >> "$GITHUB_ENV"
          echo "DEV_OTA_VERSION_NAME=0.2.0-dev.${commit_epoch}.${short_sha}" >> "$GITHUB_ENV"

      - name: Verify Gradle environment
        run: ./gradlew --version

      - name: Run Phase 1B camera selection regressions
        run: |
          ./gradlew --no-daemon --stacktrace testDebugUnitTest \
            --tests 'com.sahidcode404.camex.core.camera.runtime.ActiveCameraSelectionTest' \
            --tests 'com.sahidcode404.camex.core.camera.runtime.CameraSelectionPolicyTest' \
            --tests 'com.sahidcode404.camex.core.camera.topology.CanonicalFingerprintCollisionGuardTest' \
            --tests 'com.sahidcode404.camex.core.logic.LensDuplicateFilterTest' \
            --tests 'com.sahidcode404.camex.core.logic.CompatibilitySelectionReportJsonTest'

      - name: Run Phase 1C OTA regressions
        run: |
          ./gradlew --no-daemon --stacktrace testDebugUnitTest \
            --tests 'com.sahidcode404.camex.core.update.*'

      - name: Run Phase 2 RAW regressions
        run: |
          ./gradlew --no-daemon --stacktrace testDebugUnitTest \
            --tests 'com.sahidcode404.camex.core.camera.raw.*'

      - name: Run unit tests, lint, native build, and assemble
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug

      - name: Verify fixed-signer development OTA build
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleDevOta \
            -PdevOtaVersionCode="$DEV_OTA_VERSION_CODE" \
            -PdevOtaVersionName="$DEV_OTA_VERSION_NAME"
          APK="$(find app/build/outputs/apk/devOta -name '*.apk' -type f | head -n 1)"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "$APK" > artifacts-dev-ota-cert.txt
          CERT_SHA="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' artifacts-dev-ota-cert.txt | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$CERT_SHA" = "445538e26dd5ad46a026eeca5265fd32d1231dc8863b2383c15a5d55a3285640"
          mkdir -p artifacts-dev-ota
          install -m 0644 "$APK" artifacts-dev-ota/Camera-dev-bootstrap.apk
          (
            cd artifacts-dev-ota
            sha256sum Camera-dev-bootstrap.apk > SHA256SUMS.txt
            sha256sum --check SHA256SUMS.txt
          )

      - name: Show Android lint findings
        run: cat app/build/reports/lint-results-debug.txt

      - name: Check and package development APK
        run: ./scripts/package-dev-apk.sh app/build/outputs/apk/debug/app-debug.apk artifacts "$GITHUB_SHA"

      - name: Upload CI development APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Camera-ci-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload fixed-signer dev OTA bootstrap APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Camera-dev-ota-ci-${{ github.sha }}
          path: artifacts-dev-ota/
          if-no-files-found: error
          retention-days: 14
