name: Signed GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: camera-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, sign, and publish Camera
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      GH_TOKEN: ${{ github.token }}
      CAMERA_DEV_KEYSTORE_BASE64: ${{ secrets.CAMERA_DEV_KEYSTORE_BASE64 }}
      CAMERA_DEV_KEYSTORE_PASSWORD: ${{ secrets.CAMERA_DEV_KEYSTORE_PASSWORD }}
      CAMERA_DEV_KEY_ALIAS: ${{ secrets.CAMERA_DEV_KEY_ALIAS }}
      CAMERA_DEV_KEY_PASSWORD: ${{ secrets.CAMERA_DEV_KEY_PASSWORD }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve version from tag
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo 'Release tags must use vMAJOR.MINOR.PATCH, for example v0.1.1.' >&2
            exit 1
          fi
          major=$((10#${BASH_REMATCH[1]}))
          minor=$((10#${BASH_REMATCH[2]}))
          patch=$((10#${BASH_REMATCH[3]}))
          if ((minor > 999 || patch > 999)); then
            echo 'Release minor and patch components must be <= 999.' >&2
            exit 1
          fi
          version_code=$((major * 1000000 + minor * 1000 + patch))
          if ((version_code <= 0 || version_code >= 2147483647)); then
            echo 'Derived Android versionCode is outside the supported range.' >&2
            exit 1
          fi
          max_existing=0
          while IFS= read -r existing; do
            [[ "$existing" == "$tag" ]] && continue
            if [[ "$existing" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              e_major=$((10#${BASH_REMATCH[1]}))
              e_minor=$((10#${BASH_REMATCH[2]}))
              e_patch=$((10#${BASH_REMATCH[3]}))
              if ((e_minor <= 999 && e_patch <= 999)); then
                existing_code=$((e_major * 1000000 + e_minor * 1000 + e_patch))
                ((existing_code > max_existing)) && max_existing=$existing_code
              fi
            fi
          done < <(git tag --list 'v*')
          if ((version_code <= max_existing)); then
            echo 'Release tag must produce a versionCode newer than every existing vX.Y.Z tag.' >&2
            exit 1
          fi
          version_name="${tag#v}"
          commit_epoch="$(git show -s --format=%ct HEAD)"
          commit_timestamp="$(date --utc --date="@${commit_epoch}" +%Y-%m-%dT%H:%M:%SZ)"
          echo "CAMERA_VERSION_NAME=${version_name}" >> "$GITHUB_ENV"
          echo "CAMERA_VERSION_CODE=${version_code}" >> "$GITHUB_ENV"
          echo "CAMEX_GIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CAMEX_BUILD_TIMESTAMP_UTC=${commit_timestamp}" >> "$GITHUB_ENV"

      - name: Verify patch whitespace
        run: git diff --check "$(git merge-base origin/main HEAD)"...HEAD

      - name: Verify camera architecture
        run: ./scripts/verify-camera-architecture.sh

      - name: Verify simple OTA architecture
        run: bash scripts/verify-development-ota.sh

      - name: Validate required signing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${CAMERA_DEV_KEYSTORE_BASE64:-}" ]] || missing+=(CAMERA_DEV_KEYSTORE_BASE64)
          [[ -n "${CAMERA_DEV_KEYSTORE_PASSWORD:-}" ]] || missing+=(CAMERA_DEV_KEYSTORE_PASSWORD)
          [[ -n "${CAMERA_DEV_KEY_ALIAS:-}" ]] || missing+=(CAMERA_DEV_KEY_ALIAS)
          [[ -n "${CAMERA_DEV_KEY_PASSWORD:-}" ]] || missing+=(CAMERA_DEV_KEY_PASSWORD)
          if ((${#missing[@]} > 0)); then
            printf 'Missing required repository secret: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          dependency-graph: disabled

      - name: Install pinned Android SDK, NDK, and CMake
        run: ./scripts/install-android-sdk.sh

      - name: Restore stable development signing key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keystore="$RUNNER_TEMP/camera-development-release.jks"
          printf '%s' "$CAMERA_DEV_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          keytool -list \
            -keystore "$keystore" \
            -storepass "$CAMERA_DEV_KEYSTORE_PASSWORD" \
            -alias "$CAMERA_DEV_KEY_ALIAS" >/dev/null
          cat > keystore.properties <<EOF
          storeFile=$keystore
          storePassword=$CAMERA_DEV_KEYSTORE_PASSWORD
          keyAlias=$CAMERA_DEV_KEY_ALIAS
          keyPassword=$CAMERA_DEV_KEY_PASSWORD
          EOF

      - name: Run Phase 1B camera regressions
        run: |
          ./gradlew --no-daemon --stacktrace testDebugUnitTest \
            --tests 'com.sahidcode404.camex.core.camera.runtime.ActiveCameraSelectionTest' \
            --tests 'com.sahidcode404.camex.core.camera.runtime.CameraSelectionPolicyTest' \
            --tests 'com.sahidcode404.camex.core.camera.topology.CanonicalFingerprintCollisionGuardTest' \
            --tests 'com.sahidcode404.camex.core.logic.LensDuplicateFilterTest' \
            --tests 'com.sahidcode404.camex.core.logic.CompatibilitySelectionReportJsonTest'

      - name: Run focused OTA tests
        run: |
          ./gradlew --no-daemon --stacktrace testDebugUnitTest \
            --tests 'com.sahidcode404.camex.core.update.*'

      - name: Run full unit tests and lint
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug

      - name: Build stable signed release APK
        run: |
          ./gradlew --no-daemon --stacktrace assembleRelease \
            -PcameraVersionName="$CAMERA_VERSION_NAME" \
            -PcameraVersionCode="$CAMERA_VERSION_CODE"

      - name: Verify signed APK package version signer and native ABIs
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t release_apks < <(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f -print)
          ((${#release_apks[@]} == 1)) || { echo 'Expected exactly one release APK.' >&2; exit 1; }
          apk_src="${release_apks[0]}"
          build_tools="$ANDROID_HOME/build-tools/37.0.0"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk_src" > "$RUNNER_TEMP/apksigner.txt"
          signer_sha="$(awk -F': ' '/^Signer #1 certificate SHA-256 digest: / {gsub(":", "", $2); print tolower($2); exit}' "$RUNNER_TEMP/apksigner.txt")"
          [[ "$signer_sha" =~ ^[0-9a-f]{64}$ ]] || { echo 'Could not derive final APK signer SHA-256.' >&2; exit 1; }
          badging="$("$build_tools/aapt2" dump badging "$apk_src")"
          package_name="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" <<<"$badging" | head -n1)"
          version_code="$(sed -n "s/^package:.* versionCode='\([^']*\)'.*/\1/p" <<<"$badging" | head -n1)"
          version_name="$(sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p" <<<"$badging" | head -n1)"
          [[ "$package_name" == 'com.sahidcode404.camex' ]] || { echo 'Release APK package mismatch.' >&2; exit 1; }
          [[ "$version_code" == "$CAMERA_VERSION_CODE" ]] || { echo 'Release APK versionCode mismatch.' >&2; exit 1; }
          [[ "$version_name" == "$CAMERA_VERSION_NAME" ]] || { echo 'Release APK versionName mismatch.' >&2; exit 1; }
          apk_listing="$(unzip -Z1 "$apk_src")"
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            grep -Fxq "lib/${abi}/libcamex_native.so" <<<"$apk_listing" || { echo "Missing native ABI: ${abi}" >&2; exit 1; }
          done
          echo "RELEASE_APK_SOURCE=$apk_src" >> "$GITHUB_ENV"
          echo "RELEASE_SIGNER_SHA256=$signer_sha" >> "$GITHUB_ENV"

      - name: Generate release assets
        shell: bash
        run: |
          set -euo pipefail
          apk="Camera-${CAMERA_VERSION_NAME}.apk"
          cp "$RELEASE_APK_SOURCE" "$apk"
          apk_sha="$(sha256sum "$apk" | awk '{print $1}')"
          python3 - <<PY
          import json
          manifest = {
            "schema": 1,
            "versionCode": int("${CAMERA_VERSION_CODE}"),
            "versionName": "${CAMERA_VERSION_NAME}",
            "minSdk": 23,
            "apkAssetName": "${apk}",
            "sha256": "${apk_sha}",
            "signingCertSha256": "${RELEASE_SIGNER_SHA256}",
            "changelog": "See GitHub release notes for ${GITHUB_REF_NAME}.",
            "mandatory": False,
          }
          with open("release-manifest.json", "w", encoding="utf-8") as output:
              json.dump(manifest, output, indent=2)
              output.write("\n")
          PY
          echo "RELEASE_APK_NAME=$apk" >> "$GITHUB_ENV"
          echo "RELEASE_APK_SHA256=$apk_sha" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing GitHub Release.' >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_APK_NAME" \
            release-manifest.json \
            --generate-notes \
            --title "Camera $GITHUB_REF_NAME"

      - name: Summarize release
        run: |
          {
            echo '### Camera release'
            echo "- Tag: ${GITHUB_REF_NAME}"
            echo "- Version: ${CAMERA_VERSION_NAME} (${CAMERA_VERSION_CODE})"
            echo "- Commit: ${CAMEX_GIT_SHA}"
            echo "- Signing certificate SHA-256: ${RELEASE_SIGNER_SHA256}"
            echo "- APK: ${RELEASE_APK_NAME}"
            echo "- APK SHA-256: ${RELEASE_APK_SHA256}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean signing material
        if: always()
        run: rm -f keystore.properties "$RUNNER_TEMP/camera-development-release.jks"
