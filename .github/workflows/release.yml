name: Signed GitHub Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'ota-release/v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          case "$GITHUB_REF" in
            refs/tags/v*)
              RELEASE_TAG="$GITHUB_REF_NAME"
              ;;
            refs/heads/ota-release/v*)
              RELEASE_TAG="${GITHUB_REF#refs/heads/ota-release/}"
              ;;
            *)
              echo "Unsupported release ref: $GITHUB_REF" >&2
              exit 1
              ;;
          esac

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release ref must derive to vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi

          VERSION_NAME="${RELEASE_TAG#v}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"

          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            TAG_SHA="$(git ls-remote origin "refs/tags/$RELEASE_TAG" | awk '{print $1}')"
            EXISTING_ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
            EXPECTED_ASSETS="$(printf '%s\n' "Camera-${VERSION_NAME}.apk" release-manifest.json | sort)"

            if [[ "$TAG_SHA" == "$GITHUB_SHA" && "$EXISTING_ASSETS" == "$EXPECTED_ASSETS" ]]; then
              echo "Release $RELEASE_TAG already exists for $GITHUB_SHA with the expected assets; nothing to do."
              echo "SKIP_RELEASE=true" >> "$GITHUB_ENV"
              exit 0
            fi

            echo "Release $RELEASE_TAG already exists but does not match this commit/assets; refusing to overwrite it." >&2
            exit 1
          fi

          echo "SKIP_RELEASE=false" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        if: env.SKIP_RELEASE != 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        if: env.SKIP_RELEASE != 'true'
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android SDK, NDK, and CMake
        if: env.SKIP_RELEASE != 'true'
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;4.1.2"

      - uses: gradle/actions/setup-gradle@v4
        if: env.SKIP_RELEASE != 'true'

      - name: Restore signing key
        if: env.SKIP_RELEASE != 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/camera-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/camera-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        if: env.SKIP_RELEASE != 'true'
        run: |
          ./gradlew :app:assembleRelease \
            -PcameraVersionName="$VERSION_NAME" \
            -PcameraVersionCode="$VERSION_CODE" \
            --stacktrace

      - name: Prepare release assets
        if: env.SKIP_RELEASE != 'true'
        run: |
          APK_SRC="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -f "$APK_SRC"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_SRC" > "$RUNNER_TEMP/apksigner.txt"
          CERT_SHA="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$CERT_SHA"

          BADGING="$("$BUILD_TOOLS/aapt2" dump badging "$APK_SRC")"
          PACKAGE_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          test "$PACKAGE_NAME" = "com.sahidcode404.camex"

          APK="Camera-${VERSION_NAME}.apk"
          cp "$APK_SRC" "$APK"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"

          python3 - <<PY
          import json
          manifest = {
            "schema": 1,
            "versionCode": int("${VERSION_CODE}"),
            "versionName": "${VERSION_NAME}",
            "minSdk": 23,
            "apkAssetName": "${APK}",
            "sha256": "${SHA}",
            "signingCertSha256": "${CERT_SHA}",
            "changelog": "See GitHub release notes for ${RELEASE_TAG}.",
            "mandatory": False,
          }
          open("release-manifest.json", "w").write(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Create GitHub Release
        if: env.SKIP_RELEASE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            "Camera-${VERSION_NAME}.apk" \
            release-manifest.json \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "Camera $RELEASE_TAG"
