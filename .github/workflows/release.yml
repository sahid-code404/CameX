name: Signed GitHub Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 15859902
          packages: platform-tools

      - name: Install Android SDK, NDK, and CMake
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;4.1.2"

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/camera-release.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/camera-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          ./gradlew :app:assembleRelease \
            -PcameraVersionName="$VERSION_NAME" \
            -PcameraVersionCode="$VERSION_CODE" \
            --stacktrace

      - name: Prepare release assets
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          APK_SRC="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -f "$APK_SRC"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK_SRC" > "$RUNNER_TEMP/apksigner.txt"
          CERT_SHA="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apksigner.txt" | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$CERT_SHA"

          BADGING="$("$BUILD_TOOLS/aapt2" dump badging "$APK_SRC")"
          PACKAGE_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          test "$PACKAGE_NAME" = "com.sahidcode404.camex"

          APK="Camera-${VERSION_NAME}.apk"
          cp "$APK_SRC" "$APK"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"

          python3 - <<PY
          import json
          manifest = {
            "schema": 1,
            "versionCode": int("${VERSION_CODE}"),
            "versionName": "${VERSION_NAME}",
            "minSdk": 23,
            "apkAssetName": "${APK}",
            "sha256": "${SHA}",
            "signingCertSha256": "${CERT_SHA}",
            "changelog": "See GitHub release notes for ${GITHUB_REF_NAME}.",
            "mandatory": False,
          }
          open("release-manifest.json", "w").write(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "Camera-${VERSION_NAME}.apk" \
            release-manifest.json \
            --generate-notes \
            --title "Camera ${GITHUB_REF_NAME}"
